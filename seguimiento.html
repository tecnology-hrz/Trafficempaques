<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="public/img/favicon.ico">
    <title>Seguimiento de Orden - Traffic</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { max-width: 600px; width: 100%; }
        .logo-wrap { text-align: center; margin-bottom: 24px; }
        .logo-wrap img { height: 48px; }
        .card { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); overflow: hidden; }
        .card-header { background: linear-gradient(135deg, #29ABE2, #1a8fc4); color: #fff; padding: 28px 28px 20px; }
        .card-header h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .card-header .subtitle { font-size: 14px; opacity: 0.85; }
        .order-info { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 20px 28px; border-bottom: 1px solid #f0f0f0; }
        .order-info-item { }
        .order-info-item .label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
        .order-info-item .value { font-size: 15px; color: #222; font-weight: 500; margin-top: 2px; }
        .tracking-section { padding: 28px; }
        .tracking-section h3 { font-size: 14px; color: #666; font-weight: 600; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.5px; }
        .timeline { position: relative; padding-left: 36px; }
        .timeline::before { content: ''; position: absolute; left: 14px; top: 8px; bottom: 8px; width: 3px; background: #e8e8e8; border-radius: 2px; }
        .timeline-step { position: relative; padding-bottom: 28px; }
        .timeline-step:last-child { padding-bottom: 0; }
        .timeline-dot { position: absolute; left: -36px; top: 2px; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; z-index: 2; border: 3px solid #e8e8e8; background: #fff; color: #ccc; transition: all 0.3s; }
        .timeline-step.completado .timeline-dot { background: #16a34a; border-color: #16a34a; color: #fff; }
        .timeline-step.activo .timeline-dot { background: #29ABE2; border-color: #29ABE2; color: #fff; animation: pulse 2s infinite; }
        .timeline-step.pendiente .timeline-dot { background: #fff; border-color: #e0e0e0; color: #ccc; }
        @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(41, 171, 226, 0.4); } 50% { box-shadow: 0 0 0 8px rgba(41, 171, 226, 0); } }
        .timeline-content { }
        .timeline-title { font-size: 15px; font-weight: 600; color: #222; }
        .timeline-step.pendiente .timeline-title { color: #aaa; }
        .timeline-desc { font-size: 13px; color: #666; margin-top: 3px; }
        .timeline-step.pendiente .timeline-desc { color: #ccc; }
        .timeline-date { font-size: 11px; color: #29ABE2; font-weight: 600; margin-top: 4px; }

        /* Track por producto */
        .producto-track { border: 1px solid #eef0f2; border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; background: #fafbfc; }
        .producto-track:last-child { margin-bottom: 0; }
        .producto-track-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
        .producto-track-nombre { font-size: 14px; font-weight: 600; color: #222; display: flex; align-items: center; gap: 6px; }
        .producto-track-nombre i { color: #29ABE2; }
        .producto-track-estado { font-size: 12px; font-weight: 600; color: #29ABE2; background: #eff6ff; padding: 4px 10px; border-radius: 20px; white-space: nowrap; }
        .producto-track-timeline { padding-left: 36px; }
        .terminado-banner { background: linear-gradient(135deg, #16a34a, #15803d); color: #fff; padding: 20px 28px; text-align: center; margin: 20px 28px 28px; border-radius: 12px; }
        .terminado-banner i { font-size: 32px; margin-bottom: 8px; display: block; }
        .terminado-banner h3 { font-size: 18px; margin-bottom: 4px; }
        .terminado-banner p { font-size: 13px; opacity: 0.9; }

        /* Sección pago restante */
        .pago-restante-section { padding: 20px 28px 28px; border-top: 1px solid #f0f0f0; }
        .pago-restante-card { background: #fffbeb; border: 1px solid #fbbf24; border-radius: 12px; padding: 20px; }
        .pago-restante-card h3 { font-size: 16px; color: #92400e; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
        .pago-restante-card .monto-pendiente { font-size: 28px; font-weight: 700; color: #d97706; margin: 8px 0 16px; }
        .pago-restante-card .pago-info { font-size: 13px; color: #78350f; margin-bottom: 16px; }
        .pago-metodos { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
        .pago-metodo-btn { padding: 10px 16px; border: 2px solid #e5e7eb; border-radius: 8px; background: #fff; cursor: pointer; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; transition: all 0.2s; }
        .pago-metodo-btn:hover { border-color: #29ABE2; }
        .pago-metodo-btn.selected { border-color: #29ABE2; background: #eff6ff; color: #1d4ed8; }
        .pago-datos-seg { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 14px; margin-bottom: 16px; display: none; }
        .pago-datos-seg h4 { font-size: 13px; color: #475569; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .pago-datos-seg .dato { font-size: 12px; color: #64748b; margin-bottom: 4px; }
        .pago-datos-seg .dato span { font-weight: 600; color: #334155; }
        .comp-upload-area { margin-bottom: 16px; }
        .btn-upload-seg { padding: 10px 18px; background: #29ABE2; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; transition: background 0.2s; }
        .btn-upload-seg:hover { background: #1a8fc4; }
        .btn-upload-seg:disabled { background: #94a3b8; cursor: not-allowed; }
        .comp-preview-seg { margin-top: 10px; }
        .comp-preview-seg img { max-width: 120px; border-radius: 6px; border: 1px solid #e2e8f0; cursor: pointer; }
        .btn-confirmar-pago { width: 100%; padding: 14px; background: #16a34a; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s; }
        .btn-confirmar-pago:hover { background: #15803d; }
        .btn-confirmar-pago:disabled { background: #94a3b8; cursor: not-allowed; }
        .pago-completado { background: linear-gradient(135deg, #16a34a, #15803d); color: #fff; padding: 20px; border-radius: 12px; text-align: center; }
        .pago-completado i { font-size: 32px; margin-bottom: 8px; display: block; }
        .pago-completado h3 { font-size: 16px; margin-bottom: 4px; }
        .pago-completado p { font-size: 13px; opacity: 0.9; }
        .spinner-seg { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-state { text-align: center; padding: 60px 20px; }
        .error-state i { font-size: 48px; color: #ccc; }
        .error-state h2 { margin-top: 12px; color: #444; font-size: 20px; }
        .error-state p { color: #888; margin-top: 8px; font-size: 14px; }

        /* Sección entrega/remisión */
        .entrega-section { padding: 20px 28px; border-top: 1px solid #f0f0f0; }
        .entrega-card { background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 12px; padding: 20px; }
        .entrega-card h3 { font-size: 16px; color: #0c4a6e; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
        .entrega-card p { font-size: 13px; color: #0369a1; margin-bottom: 16px; }
        .entrega-opciones { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
        .entrega-opcion { flex: 1; min-width: 140px; padding: 16px; border: 2px solid #e2e8f0; border-radius: 12px; background: #fff; cursor: pointer; text-align: center; transition: all 0.2s; }
        .entrega-opcion:hover { border-color: #29ABE2; background: #f0f9ff; }
        .entrega-opcion.selected { border-color: #29ABE2; background: #eff6ff; }
        .entrega-opcion i { font-size: 28px; display: block; margin-bottom: 8px; color: #29ABE2; }
        .entrega-opcion .opcion-titulo { font-size: 14px; font-weight: 600; color: #222; }
        .entrega-opcion .opcion-desc { font-size: 11px; color: #666; margin-top: 4px; }
        .entrega-ubicacion { margin-top: 16px; display: none; }
        .entrega-ubicacion.visible { display: block; }
        .entrega-ubicacion label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 8px; }
        .entrega-ubicacion input { width: 100%; padding: 12px 14px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; outline: none; transition: border 0.2s; }
        .entrega-ubicacion input:focus { border-color: #29ABE2; }
        .btn-ubicacion { width: 100%; margin-top: 10px; padding: 12px; background: #f59e0b; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: background 0.2s; }
        .btn-ubicacion:hover { background: #d97706; }
        .btn-confirmar-entrega { width: 100%; margin-top: 16px; padding: 14px; background: #29ABE2; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s; }
        .btn-confirmar-entrega:hover { background: #1a8fc4; }
        .btn-confirmar-entrega:disabled { background: #94a3b8; cursor: not-allowed; }
        .entrega-confirmada { background: linear-gradient(135deg, #29ABE2, #1a8fc4); color: #fff; padding: 20px; border-radius: 12px; text-align: center; }
        .entrega-confirmada i { font-size: 32px; margin-bottom: 8px; display: block; }
        .entrega-confirmada h3 { font-size: 16px; margin-bottom: 4px; }
        .entrega-confirmada p { font-size: 13px; opacity: 0.9; }
        .mapa-preview { margin-top: 12px; border-radius: 8px; overflow: hidden; border: 1px solid #e2e8f0; }
        .mapa-preview iframe { width: 100%; height: 200px; border: none; }

        @media (max-width: 500px) {
            .order-info { grid-template-columns: 1fr; gap: 10px; }
            .card-header { padding: 22px 20px 16px; }
            .tracking-section { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-wrap">
            <img src="public/img/logo.png" alt="Traffic">
        </div>
        <div class="card" id="mainCard">
            <div class="card-header">
                <h1 id="ordenNumero">Cargando...</h1>
                <span class="subtitle" id="ordenSubtitle">Seguimiento de orden</span>
            </div>
            <div class="order-info" id="orderInfo">
                <div class="order-info-item">
                    <div class="label">Cliente</div>
                    <div class="value" id="segCliente">-</div>
                </div>
                <div class="order-info-item">
                    <div class="label">Tipo</div>
                    <div class="value" id="segTipo">-</div>
                </div>
                <div class="order-info-item">
                    <div class="label">Fecha de pedido</div>
                    <div class="value" id="segFechaPedido">-</div>
                </div>
                <div class="order-info-item">
                    <div class="label">Entrega estimada</div>
                    <div class="value" id="segFechaEntrega">-</div>
                </div>
            </div>
            <div class="tracking-section">
                <h3>Estado del pedido</h3>
                <div class="timeline" id="timeline"></div>
            </div>
            <div id="terminadoBanner" style="display:none;"></div>
            <div id="entregaSection" style="display:none;"></div>
            <div id="pagoRestanteSection" style="display:none;"></div>
        </div>
    </div>
    <script type="module" src="assets/js/seguimiento.js"></script>
</body>
</html>
