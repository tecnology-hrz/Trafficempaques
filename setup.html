<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Inicial - Traffic</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .box { background: #fff; border-radius: 14px; padding: 44px; max-width: 500px; width: 92%; box-shadow: 0 10px 40px rgba(0,0,0,0.08); }
        h2 { color: #222; margin-bottom: 8px; font-size: 22px; }
        .desc { color: #666; font-size: 14px; margin-bottom: 24px; line-height: 1.6; }
        .info { background: #f0f9ff; border: 1.5px solid #bae6fd; border-radius: 10px; padding: 14px 18px; font-size: 13px; color: #0369a1; margin-bottom: 20px; line-height: 1.6; }
        .info strong { color: #222; }
        button { background: #29ABE2; color: #fff; border: none; padding: 13px 32px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: background 0.2s; }
        button:hover { background: #1a90c8; }
        #log { margin-top: 20px; font-size: 13px; line-height: 2; }
        #log p { display: flex; align-items: center; gap: 6px; }
    </style>
</head>
<body>
    <div class="box">
        <h2><i class="bi bi-database-gear"></i> Setup Inicial</h2>
        <p class="desc">Crea los 3 usuarios en la coleccion <strong>usuarios</strong> de Firestore.</p>
        <div class="info">
            <strong>Usuarios que se crearan:</strong><br>
            admin@traffic.com / Traffic2026! <i class="bi bi-arrow-right"></i> Administrador<br>
            digital@traffic.com / Traffic2026! <i class="bi bi-arrow-right"></i> Digital<br>
            imprenta@traffic.com / Traffic2026! <i class="bi bi-arrow-right"></i> Imprenta
        </div>
        <button id="btnSetup"><i class="bi bi-cloud-upload"></i> Crear Usuarios</button>
        <div id="log"></div>
    </div>
    <script type="module" src="assets/js/setup.js"></script>
</body>
</html>
