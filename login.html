<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="public/img/favicon.ico">
    <title>Traffic - Iniciar Sesion</title>
    <link rel="stylesheet" href="assets/css/login.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

    <!-- Volver al sitio publico -->
    <a class="btn-volver" href="index.html">
        <i class="bi bi-arrow-left"></i>
        <span>Volver al sitio</span>
    </a>

    <div class="login-wrapper">

        <!-- Panel izquierdo: marca -->
        <div class="login-brand">
            <img src="public/img/logo.png" alt="Traffic Empaques Publicidad" class="brand-logo">
            <div class="brand-divider"></div>
            <span class="brand-tagline">Sistema de Gestion</span>
            <p class="brand-desc">Acceso exclusivo para personal autorizado de Traffic Empaques - Publicidad</p>
        </div>

        <!-- Panel derecho: formulario -->
        <div class="login-form-panel">
            <h1 class="login-title">Bienvenido</h1>
            <p class="login-subtitle">Ingresa tus credenciales para continuar</p>

            <form id="loginForm" novalidate>

                <div class="form-group">
                    <label for="email">Correo electronico</label>
                    <div class="input-wrapper">
                        <i class="bi bi-envelope input-icon"></i>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="usuario@traffic.com"
                            autocomplete="email"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Contrasena</label>
                    <div class="input-wrapper">
                        <i class="bi bi-lock input-icon"></i>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Ingresa tu contrasena"
                            autocomplete="current-password"
                            required
                        >
                        <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar contrasena">
                            <i class="bi bi-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login" id="btnLogin">
                    <i class="bi bi-box-arrow-in-right"></i> Ingresar
                </button>

                <div class="error-msg" id="errorMsg" role="alert">
                    <i class="bi bi-exclamation-circle"></i>
                    <span id="errorText"></span>
                </div>

            </form>

            <a class="login-back-link" href="index.html">
                <i class="bi bi-arrow-left-short"></i> Volver a la pagina principal
            </a>

            <div class="login-footer">
                &copy; 2026 Traffic Empaques - Publicidad. Todos los derechos reservados.
                <div class="dev-credit">Desarrollado por <strong>TECNOLOGIA HRZ</strong></div>
            </div>
        </div>

    </div>

    <script type="module" src="assets/js/login.js"></script>
</body>
</html>
